<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Modelos | Fundacite Yaracuy</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <header>
        <span>Fundacite Yaracuy — Registro de Modelos</span>
        <img src="Logofundacite.webp" alt="logo" class="logo">
    </header>

    <main>
        <section class="clase-card">
            <div class="clase-titulo" style="display: flex; justify-content: space-between; align-items: center;">
                <h3><i class="ph ph-squares-four" style="margin-right:8px;"></i>Modelos Registrados</h3>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 13px; color: #64748b; font-weight: 500; font-style: italic;">Presione aquí
                        para agregar </span>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modeloModal"
                        style="border-radius: 50%; width: 40px; height: 40px; padding: 0; font-size: 20px; line-height: 1; box-shadow: 0 4px 6px -1px rgba(30, 86, 148, 0.2);">
                        +
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="clase-tabla" id="tabla-modelos">
                    <thead>
                        <tr style="border-bottom: 2px solid #e2e6eb;">
                            <th style="padding: 10px; text-align: left;">#</th>
                            <th style="padding: 10px; text-align: left;">Nombre del Modelo</th>
                            <th style="padding: 10px; text-align: left;">Marca</th>
                            <th style="padding: 10px; text-align: left;">Especificaciones</th>
                            <th style="padding: 10px; text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-modelos-body">
                        <tr id="empty-row">
                            <td colspan="5" style="text-align: center; padding: 20px; color: #9ba5b2;">
                                No hay modelos creados. Haga clic en "+" para agregar.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Modal -->
        <div class="modal fade" id="modeloModal" tabindex="-1" aria-labelledby="modeloModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content" style="border-radius: 12px; border: none;">
                    <div class="modal-header" style="background: #1e5694; color: white;">
                        <h5 class="modal-title" id="modeloModalLabel"><i class="ph ph-squares-four me-2"></i>Nuevo
                            Modelo</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <form id="form-modelo">
                            <div class="mb-3">
                                <label for="modelo-nombre">Nombre del Modelo <span class="req">*</span></label>
                                <input type="text" id="modelo-nombre" class="form-control"
                                    placeholder="Ej: OptiPlex 3080, ThinkPad E15, IdeaPad 3" maxlength="60" required
                                    autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label for="modelo-marca">Marca <span class="req">*</span></label>
                                <select id="modelo-marca" class="form-control">
                                    <option value="">Seleccionar marca...</option>
                                </select>
                                <small style="color:#64748b; font-size:11px;">
                                    Si no hay marcas, <a href="MARCA.html" style="color:#1e5694;">créalas primero
                                        aquí</a>.
                                </small>
                            </div>
                            <div class="mb-3">
                                <label for="modelo-specs">Especificaciones <span
                                        style="color:#9ba5b2;">(opcional)</span></label>
                                <textarea id="modelo-specs" class="form-control" rows="3"
                                    placeholder="Ej: Procesador i5, 8GB RAM, 256GB SSD..."></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary px-4" onclick="agregarModelo()">Crear
                            Modelo</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-secondary"
                onclick="if(window.goHome) window.goHome(); else window.location.href='../../dashboard/index.html'">ATRÁS</button>
            <button type="button" class="btn btn-primary" onclick="guardarModelos()">GUARDAR Y FINALIZAR</button>
        </div>

        <center style="margin-top: 2rem;">
            <button type="button" class="btn btn-outline-primary"
                onclick="if(window.goHome) window.goHome(); else window.location.href='../../dashboard/index.html'">SALIR</button>
        </center>
    </main>

    <script>
        var modelos = JSON.parse(localStorage.getItem('modelos') || '[]');
        renderTabla();
        cargarMarcasEnSelect();

        function cargarMarcasEnSelect() {
            const sel = document.getElementById('modelo-marca');
            const marcas = JSON.parse(localStorage.getItem('marcas') || '[]');
            sel.innerHTML = '<option value="">Seleccionar marca...</option>';
            if (marcas.length === 0) {
                sel.innerHTML += '<option disabled>— Sin marcas registradas —</option>';
            } else {
                marcas.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.nombre || m;
                    opt.textContent = m.nombre || m;
                    sel.appendChild(opt);
                });
            }
        }

        // Recargar marcas al abrir el modal (por si se añadieron)
        document.getElementById('modeloModal').addEventListener('show.bs.modal', cargarMarcasEnSelect);

        function agregarModelo() {
            const nombre = document.getElementById('modelo-nombre').value.trim();
            const marca = document.getElementById('modelo-marca').value;
            const specs = document.getElementById('modelo-specs').value.trim();

            if (!nombre || !marca) {
                if (window.showStyledAlert) showStyledAlert('El nombre del modelo y la marca son obligatorios.', 'Error', 'ph-warning', '#dc2626');
                else alert('Complete los campos obligatorios.');
                return;
            }

            if (modelos.find(m => m.nombre.toLowerCase() === nombre.toLowerCase() && m.marca === marca)) {
                if (window.showStyledAlert) showStyledAlert('Ya existe ese modelo para esa marca.', 'Duplicado', 'ph-warning', '#dc2626');
                else alert('Modelo duplicado.');
                return;
            }

            modelos.push({ id: String(Date.now()), nombre, marca, especificaciones: specs });
            localStorage.setItem('modelos', JSON.stringify(modelos));
            renderTabla();

            const modal = bootstrap.Modal.getInstance(document.getElementById('modeloModal'));
            if (modal) modal.hide();
            document.getElementById('form-modelo').reset();

            if (window.showStyledAlert) showStyledAlert('Modelo "' + nombre + '" registrado.', 'Éxito', 'ph-check-circle', '#16a34a');
        }

        function renderTabla() {
            const cuerpo = document.getElementById('lista-modelos-body');
            if (modelos.length === 0) {
                cuerpo.innerHTML = '<tr id="empty-row"><td colspan="5" style="text-align: center; padding: 20px; color: #9ba5b2;">No hay modelos creados. Haga clic en "+" para agregar.</td></tr>';
                return;
            }
            cuerpo.innerHTML = '';
            modelos.forEach((m, i) => {
                cuerpo.innerHTML += `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px; color: #9ba5b2;">${i + 1}</td>
                        <td style="padding: 10px; font-weight: bold;">${m.nombre}</td>
                        <td style="padding: 10px;">${m.marca || '—'}</td>
                        <td style="padding: 10px; color: #64748b; font-size:13px;">${m.especificaciones || '—'}</td>
                        <td style="padding: 10px; text-align: center;">
                            <button class="btn btn-sm btn-danger" onclick="eliminarModelo(${i})">X</button>
                        </td>
                    </tr>`;
            });
        }

        function eliminarModelo(index) {
            modelos.splice(index, 1);
            localStorage.setItem('modelos', JSON.stringify(modelos));
            renderTabla();
        }

        function guardarModelos() {
            localStorage.setItem('modelos', JSON.stringify(modelos));
            if (window.showStyledAlert) showStyledAlert('¡Modelos guardados correctamente!', 'Éxito', 'ph-check-circle', '#16a34a');
            else alert('¡Guardado correctamente!');
        }
    </script>

    <style>
        .modal-body label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: #4b5563;
        }

        .form-control {
            display: block;
            width: 100%;
            padding: 8px;
            border: 1.5px solid #d1d5db;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 12px;
        }

        .req {
            color: #dc2626;
        }
    </style>

    <footer>
        <p>&copy; 2026 Fundacite Yaracuy — Sistema de Inventario</p>
    </footer>
</body>

</html>
