<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Fundacite Yaracuy</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <span>Fundacite Yaracuy — Administración</span>
    <img src="Logofundacite.webp" alt="logo" class="logo">
  </header>

  <main>

    <section class="clase-card">
      <div class="clase-titulo">
        <h3>Registrar Usuario</h3>
      </div>

      <form id="registerForm">
        <table class="clase-tabla">
          <tr>
            <td>
              <label for="nombres">Nombres <span class="req">*</span></label>
              <input type="text" id="nombres" name="nombres" placeholder="Ingrese sus nombres" required>
            </td>
          </tr>
          <tr>
            <td>
              <label for="apellidos">Apellidos <span class="req">*</span></label>
              <input type="text" id="apellidos" name="apellidos" placeholder="Ingrese sus apellidos" required>
            </td>
          </tr>
          <tr>
            <td>
              <label for="correo">Correo Electrónico <span class="req">*</span></label>
              <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </td>
          </tr>
          <tr>
            <td>
              <label for="usuario">Usuario <span class="req">*</span></label>
              <input type="text" id="usuario" name="usuario" placeholder="Cree un usuario" required>
            </td>
          </tr>
          <tr>
            <td>
              <label for="contrasena">Contraseña <span class="req">*</span></label>
              <input type="password" id="contrasena" name="contrasena" placeholder="Cree una contraseña" required>
            </td>
          </tr>
        </table>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="if(window.goHome) window.goHome(); else window.location.href='../../dashboard/index.html';">SALIR</button>
          <button type="button" class="btn btn-primary" onclick="guardarUsuario()">GUARDAR Y FINALIZAR</button>
        </div>
      </form>
    </section>

  </main>

  <script>
    function guardarUsuario() {
        const nombres = document.getElementById('nombres').value.trim();
        const apellidos = document.getElementById('apellidos').value.trim();
        const correo = document.getElementById('correo').value.trim();
        const usuario = document.getElementById('usuario').value.trim();
        const contrasena = document.getElementById('contrasena').value.trim();

        if (!nombres || !apellidos || !correo || !usuario || !contrasena) {
            if(window.showStyledAlert) showStyledAlert('Debe completar todos los campos.', 'Atención', 'ph-warning', '#dc2626');
            else alert('Debe completar todos los campos.');
            return;
        }

        if(window.showStyledAlert) {
            showStyledAlert('Usuario "' + usuario + '" registrado correctamente.', 'Éxito', 'ph-check-circle', '#10b981');
            setTimeout(() => {
                if(window.goHome) window.goHome();
                else window.location.href = '../../dashboard/index.html';
            }, 1500);
        } else {
            alert('Usuario registrado correctamente.');
            if(window.goHome) window.goHome();
            else window.location.href = '../../dashboard/index.html';
        }
    }
  </script>

  <footer>
    <p>&copy; 2026 Fundacite Yaracuy — Sistema de Inventario</p>
  </footer>

</body>

</html>
