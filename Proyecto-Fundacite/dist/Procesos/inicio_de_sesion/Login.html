<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Fundacite Yaracuy</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="login-wrapper">
        <img src="Logofundacite.webp" alt="Fundacite Yaracuy Logo" class="login-logo">

        <section class="clase-card login-card">
            <div class="clase-titulo">
                <h3>Iniciar Sesión</h3>
            </div>

            <form id="loginForm" novalidate>
                <table class="clase-tabla">
                    <tr>
                        <td>
                            <label for="usuario">Usuario <span class="req">*</span></label>
                            <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="contrasena">Contraseña <span class="req">*</span></label>
                            <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña"
                                required>
                        </td>
                    </tr>
                </table>

                <div class="form-actions" style="justify-content: center; flex-direction: column; gap: 15px;">
                    <div style="text-align: center; font-size: 0.85rem; color: #64748b;">
                        Usuario: <strong>admin</strong> | Contraseña: <strong>123</strong>)
                    </div>
                    <input type="submit" value="INGRESAR" class="btn btn-primary" style="width: 100%;">
                </div>
            </form>
        </section>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            var usuario = document.getElementById('usuario').value.trim();
            var contrasena = document.getElementById('contrasena').value.trim();

            if (!usuario || !contrasena) {
                alert('Por favor, complete todos los campos.');
                return;
            }

            // Buscar en localStorage o usar el default
            const dbUsers = JSON.parse(localStorage.getItem('admin_users') || '[]');

            // Usuario default si no hay base de datos configurada o como fallback
            const defaultUser = { usuario: 'admin', contrasena: '123' };

            // Validar
            const validUser = dbUsers.find(u => u.usuario === usuario && u.contrasena === contrasena);
            const isDefault = (usuario === defaultUser.usuario && contrasena === defaultUser.contrasena);

            if (validUser || isDefault) {
                // Guardar usuario y redirigir a la página principal (dashboard)
                localStorage.setItem('loggedUser', usuario);
                window.location.href = '../../dashboard/index.html';
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        });
    </script>
</body>

</html>
