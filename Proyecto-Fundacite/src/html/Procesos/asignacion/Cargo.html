<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignacion de Equipos | Fundacite Yaracuy</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .info-readonly { background: #f8fafc; color: #64748b; border: 1.5px solid #e2e8f0; border-radius: 6px; padding: 8px 12px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .field-hint { font-size: 11px; color: #94a3b8; margin-top: 3px; }
        .create-link { font-size: 12px; color: #1e5694; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; }
        .create-link:hover { text-decoration: underline; }
        select.form-control { display: block; width: 100%; padding: 8px 12px; border: 1.5px solid #d1d5db; border-radius: 6px; font-size: 14px; background: white; }
    </style>
</head>

<body>

    <header>
        <span>Fundacite Yaracuy — Asignacion de Equipos Informáticos</span>
        <img src="Logofundacite.webp" alt="logo" class="logo">
    </header>

    <main>

        <section class="clase-card">
            <div class="clase-titulo">
                <h3>Cargo</h3>
            </div>

            <table class="clase-tabla">
                <tr>
                    <td>
                        <label for="sel-cargo">Cargo <span class="req">*</span></label>
                        <select id="sel-cargo" class="form-control" onchange="mostrarInfoCargo()">
                            <option value="">Seleccionar cargo...</option>
                        </select>
                        <p class="field-hint">Seleccione un cargo registrado en el maestro de Plantel.</p>
                        <a class="create-link" href="../plantel/Cargos.html">
                            ＋ Crear cargo en Plantel
                        </a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Nombre del Cargo (confirmación)</label>
                        <div class="info-readonly" id="inf-cargo-nombre">—</div>
                    </td>
                </tr>
            </table>
        </section>

        <div class="form-actions">
            <form method="get" action="Empleado.html">
                <input type="submit" name="ATRÁS" value="ATRÁS" class="btn btn-secondary">
            </form>
            <form method="get" action="Departamento.html">
                <input type="submit" name="SIGUIENTE" value="SIGUIENTE" class="btn btn-primary">
            </form>
        </div>

        <br><br><br>
        <center>
            <form method="get" action="../../dashboard/index.html">
                <input type="submit" name="Salir" value="SALIR" class="btn btn-primary">
            </form>
        </center>
    </main>

    <footer>
        <p>&copy; 2026 Fundacite Yaracuy — Sistema de Inventario</p>
    </footer>

    <script>
        // Cargar cargos desde localStorage (maestro Plantel > Cargos)
        function cargarCargos() {
            const select = document.getElementById('sel-cargo');
            const cargos = JSON.parse(localStorage.getItem('cargos') || '[]');
            select.innerHTML = '<option value="">Seleccionar cargo...</option>';
            if (cargos.length === 0) {
                const opt = document.createElement('option');
                opt.disabled = true;
                opt.textContent = '— No hay cargos registrados —';
                select.appendChild(opt);
            } else {
                cargos.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.nombre || c;
                    opt.textContent = c.nombre || c;
                    select.appendChild(opt);
                });
            }
        }

        function mostrarInfoCargo() {
            const val = document.getElementById('sel-cargo').value;
            document.getElementById('inf-cargo-nombre').textContent = val || '—';
        }

        cargarCargos();
    </script>

</body>

</html>
